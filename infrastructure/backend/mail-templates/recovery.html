<!doctype html>
<html lang="en">
  <body>
    <h1>Reset your PC Exchange Egypt password</h1>
    <p>
      <a
        href="{{ if eq .RedirectTo .SiteURL }}{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery{{ else }}{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=recovery{{ end }}"
        >Reset password</a
      >
    </p>
    <p>If you did not request a reset, ignore this message.</p>
    <footer>
      <p>
        PC Exchange Egypt · Need help? Contact
        <a href="mailto:support@pc-ex.store">support@pc-ex.store</a>.
      </p>
    </footer>
  </body>
</html>
